<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Geschützte Seite</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14161b;color:#e6e8ec;font:15px system-ui,sans-serif}
form{background:#1e2128;border:1px solid #2e333d;border-radius:14px;padding:28px;width:min(92vw,340px);text-align:center}
h1{font-size:18px;margin:0 0 16px}
input,button{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2e333d;font:inherit;margin-bottom:10px}
input{background:#14161b;color:inherit}
button{background:#5865f2;border-color:#5865f2;color:#fff;cursor:pointer}
#e{color:#f87171;min-height:1.2em;font-size:13px}
</style></head><body>
<form id="f"><h1>🔒 Geschützte Seite</h1>
<input id="p" type="password" placeholder="Passwort" autofocus autocomplete="current-password">
<button>Entsperren</button><div id="e"></div></form>
<script>
const D={"s": "BMIDj4vN7BVzJBv2eq6VqA==", "n": "Fi1k9OXTqp9bwT0y", "c": "COrFeuPW3ia0RUha9pqfIkNi2CykCF4ZVn+8dsBq6SqSUMAxn/uwVoMx4dxpTTH5tf559onVoE71e6B3Ku6RXALt3/PEBltersU/uWTcvHNewaBdAfTJd/LFttIPeZHwYdijfmFKMWa6z/3/LULHjc2zPeSq3PYIYxCCnowJes6teT7lsFaxRNVHafTHurGGiCEzdcObtInYZqparspoIZi4YM39zjo6lHcbeG49wFwVfksoFQXSiXmmmCMiXWJI+lMCW2RkwifPuiq8MVEkL109G1OgFLRjdheftlIyUhflsLWKJRWCRpoJHwTa7bnNxZHwLhT4Cd3/UtagExB6QDe8rRtNxc+QqTx4JJduf3xC98RRJZLfyVRhq6YgsbMOSx4zScnqftxMpabOPoMPLKzOf27gslWXAmBRFFSzW91lBDSm1U99V7omAJNIv/ixBEaEglTq2Cl0DafuHRajlT15tCNhvatuBUVIl0KIBUFC0LG//T4pxLhz4w5JZZr2fv/FNuwRqd/VAW1XF9zonhd/T1may4FJSHgi8QrzZ4mAOoB3AjJ/5nkPp7XDIS1G880KvsN/gUhIx2yzP8+/AUe4EhQGLEAedlvNWaBxT2Ak38JNZbAtq7yzkOTXEy3BneSLJGG7a9M7Phunx6zLwSjf11Q=", "i": 600000};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.n)},key,b64(D.c));
  try{sessionStorage.setItem('k',pw)}catch(e){}
  document.open();document.write(new TextDecoder().decode(pt));document.close();
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const err=document.getElementById('e');err.textContent='Entschlüssele …';
  try{await unlock(document.getElementById('p').value)}catch(e){err.textContent='Falsches Passwort.'}
});
let saved=null;try{saved=sessionStorage.getItem('k')}catch(e){}
if(saved)unlock(saved).catch(()=>{try{sessionStorage.removeItem('k')}catch(e){}});
</script></body></html>
